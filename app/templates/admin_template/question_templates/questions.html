{% extends "layout.html" %}

{% block title %}Manage Quiz Questions{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center"> Manage Questions for <strong>{{ quiz.name }}</strong></h1>

    <div class="d-flex justify-content-between align-items-center my-3">
        <a href="{{ url_for('admin.add_question', quiz_id=quiz.id) }}" class="btn btn-primary">
             Add Question
        </a>

        
        <form class="d-flex" method="post">
            <input class="form-control me-2" type="text" name="query" placeholder="Search question..." value="{{ query }}">
            <button class="btn btn-outline-primary" type="submit">🔍 Search</button>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Question Statement</th>
                    <th class="text-center" colspan="2">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for question in questions %}
                <tr>
                    <td class="fw-bold">{{ question.id }}</td>
                    <td>{{ question.question_statement }}</td>
                    <td class="text-center">
                        <a href="{{ url_for('admin.edit_question', quiz_id=quiz.id, question_id=question.id) }}"
                           class="btn btn-warning btn-sm"> Edit</a>
                    </td>
                    <td class="text-center">
                        <form action="{{ url_for('admin.delete_question', quiz_id=quiz.id, question_id=question.id) }}" method="post">
                            <button class="btn btn-danger btn-sm"
                                    onclick="return confirm('Are you sure you want to delete this question?')"> Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
